<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gem Text Extractor</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --panel: #12161c;
    --panel-2: #171c24;
    --text: #f4f7fb;
    --muted: #9aa4b2;
    --border: #2a3340;
    --border-strong: #445064;
    --accent: #79a8ff;
    --accent-soft: rgba(121, 168, 255, .12);
    --danger: #ff8585;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--text);
  }
  main { max-width: 920px; margin: 0 auto; padding: 28px 20px 48px; }
  .topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; }
  .title-wrap { min-width: 0; }
  h1 { font-size: 1.7rem; margin: 0 0 8px; letter-spacing:.01em; }
  .sub { color: var(--muted); line-height: 1.7; margin: 0; }
  .lang-btn {
    flex: 0 0 auto;
    min-width: 92px;
    font: inherit;
    font-weight: 700;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
  }
  .lang-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .drop {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 150px;
    border: 2px dashed var(--border-strong);
    border-radius: 16px;
    padding: 28px 20px;
    text-align: center;
    line-height: 1.6;
    cursor: pointer;
    margin: 22px 0;
    background: var(--panel);
    transition: border-color .15s ease, background .15s ease, transform .15s ease;
  }
  .drop:hover { border-color: var(--accent); background: var(--panel-2); }
  .drop.drag { border-style: solid; border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
  .drop strong { display: block; font-size: 1.45rem; margin: 0 0 6px; }
  .drop .hint { display:block; color: var(--muted); font-size: 1rem; }
  input[type=file] { display: none; }
  button {
    font: inherit;
    padding: 9px 14px;
    border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); background: var(--accent-soft); }
  .card { border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-top: 16px; background: var(--panel); }
  .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .name { font-weight: 700; overflow-wrap: anywhere; }
  .status { font-size: .9rem; color: var(--muted); margin-top: 3px; }
  textarea {
    width: 100%;
    min-height: 340px;
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #0d1117;
    color: var(--text);
    font: 14px/1.55 ui-monospace, SFMono-Regular, Consolas, "Noto Sans Mono CJK JP", monospace;
    resize: vertical;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .opts { display:flex; gap:18px; flex-wrap:wrap; align-items:center; margin: 12px 0 0; font-size:.92rem; }
  .opts label { cursor:pointer; }
  .note { font-size: .86rem; color: var(--muted); line-height:1.65; }
  .error { color: var(--danger); }
  @media (max-width: 640px) {
    main { padding-top: 20px; }
    .topbar { align-items:flex-start; }
    h1 { font-size:1.45rem; }
    .lang-btn { min-width: 82px; }
    .drop strong { font-size:1.2rem; }
  }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div class="title-wrap">
      <h1 data-i18n="title">Gem テキスト抽出器</h1>
      <p class="sub" data-i18n="subtitle">Google Drive に保存された Gemini Gem のバイナリから、タイトル・説明・指示本文・参照ファイル情報を抽出して、文字化けしにくい UTF-8 テキストにします。処理はすべてこのブラウザ内で行い、ファイルは外部送信しません。</p>
    </div>
    <button id="langToggle" class="lang-btn" type="button" aria-label="Switch language">English</button>
  </div>

  <label id="drop" class="drop" for="picker">
    <strong data-i18n="dropTitle">Gem ファイルをここにドロップ</strong>
    <span class="hint" data-i18n="dropHint">またはクリックして選択（複数可）</span>
  </label>
  <input id="picker" type="file" multiple>

  <div class="opts">
    <label><input id="bom" type="checkbox" checked> <span data-i18n="bomLabel">保存時に UTF-8 BOM を付ける</span></label>
    <label><input id="refs" type="checkbox" checked> <span data-i18n="refsLabel">参照ファイル情報も含める</span></label>
  </div>
  <p class="note" data-i18n="note">※ サンプルで確認した Gem 形式（Protocol Buffers 系）に合わせています。Google 側の保存形式が変わった場合は「汎用文字列抽出」に自動フォールバックします。</p>

  <section id="results"></section>
</main>
<script>
(() => {
  const picker = document.getElementById('picker');
  const drop = document.getElementById('drop');
  const results = document.getElementById('results');
  const bom = document.getElementById('bom');
  const refs = document.getElementById('refs');
  const langToggle = document.getElementById('langToggle');

  const I18N = {
    ja: {
      title: 'Gem テキスト抽出器',
      subtitle: 'Google Drive に保存された Gemini Gem のバイナリから、タイトル・説明・指示本文・参照ファイル情報を抽出して、文字化けしにくい UTF-8 テキストにします。処理はすべてこのブラウザ内で行い、ファイルは外部送信しません。',
      dropTitle: 'Gem ファイルをここにドロップ',
      dropHint: 'またはクリックして選択（複数可）',
      bomLabel: '保存時に UTF-8 BOM を付ける',
      refsLabel: '参照ファイル情報も含める',
      note: '※ サンプルで確認した Gem 形式（Protocol Buffers 系）に合わせています。Google 側の保存形式が変わった場合は「汎用文字列抽出」に自動フォールバックします。',
      langButton: 'English',
      parsing: '解析中…',
      modeGem: 'Gem構造を認識',
      modeFallback: '汎用文字列抽出',
      failed: '失敗',
      save: 'TXT保存',
      copy: 'コピー',
      copied: 'コピー済み',
      descriptionHeading: '説明',
      instructionsHeading: 'Gem の指示',
      refsHeading: '参照ファイル',
      referenceLink: '参照リンク',
      noUtf8: 'UTF-8文字列を抽出できませんでした。'
    },
    en: {
      title: 'Gem Text Extractor',
      subtitle: 'Extracts the title, description, instructions, and reference-file information from Gemini Gem binaries saved in Google Drive, and converts them into clean UTF-8 text. Everything is processed locally in your browser; files are never uploaded.',
      dropTitle: 'Drop Gem files here',
      dropHint: 'or click to choose files (multiple files supported)',
      bomLabel: 'Add UTF-8 BOM when saving',
      refsLabel: 'Include reference-file information',
      note: 'This tool is based on the Gem format confirmed in sample files (Protocol Buffers family). If Google changes the storage format, it automatically falls back to generic UTF-8 string extraction.',
      langButton: '日本語',
      parsing: 'Parsing…',
      modeGem: 'Gem structure detected',
      modeFallback: 'Generic string extraction',
      failed: 'Failed',
      save: 'Save TXT',
      copy: 'Copy',
      copied: 'Copied',
      descriptionHeading: 'Description',
      instructionsHeading: 'Gem Instructions',
      refsHeading: 'Reference Files',
      referenceLink: 'Reference link',
      noUtf8: 'No UTF-8 text strings could be extracted.'
    }
  };

  let lang = localStorage.getItem('gemExtractorLang') === 'en' ? 'en' : 'ja';
  const t = key => I18N[lang][key] ?? key;

  function applyLanguage() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.dataset.i18n);
    });
    langToggle.textContent = t('langButton');
    langToggle.setAttribute('aria-label', lang === 'ja' ? 'Switch to English' : '日本語に切り替え');
  }

  langToggle.addEventListener('click', () => {
    lang = lang === 'ja' ? 'en' : 'ja';
    localStorage.setItem('gemExtractorLang', lang);
    applyLanguage();
  });

  applyLanguage();

  const tdFatal = new TextDecoder('utf-8', {fatal:true});

  function readVarint(bytes, pos) {
    let value = 0n, shift = 0n, i = pos;
    while (i < bytes.length && shift <= 70n) {
      const b = BigInt(bytes[i++]);
      value |= (b & 0x7fn) << shift;
      if ((b & 0x80n) === 0n) return { value, next: i };
      shift += 7n;
    }
    throw new Error('invalid varint');
  }

  function parseMessage(bytes) {
    const fields = [];
    let i = 0;
    while (i < bytes.length) {
      const start = i;
      let key;
      try { key = readVarint(bytes, i); } catch { return {fields, complete:false}; }
      i = key.next;
      const fieldNo = Number(key.value >> 3n);
      const wire = Number(key.value & 7n);
      if (!fieldNo) return {fields, complete:false};

      if (wire === 0) {
        let v;
        try { v = readVarint(bytes, i); } catch { return {fields, complete:false}; }
        i = v.next;
        fields.push({fieldNo, wire, value:v.value, start, end:i});
      } else if (wire === 1) {
        if (i + 8 > bytes.length) return {fields, complete:false};
        fields.push({fieldNo, wire, value:bytes.slice(i, i+8), start, end:i+8});
        i += 8;
      } else if (wire === 2) {
        let len;
        try { len = readVarint(bytes, i); } catch { return {fields, complete:false}; }
        i = len.next;
        if (len.value > BigInt(Number.MAX_SAFE_INTEGER)) return {fields, complete:false};
        const n = Number(len.value);
        if (i + n > bytes.length) return {fields, complete:false};
        fields.push({fieldNo, wire, value:bytes.slice(i, i+n), start, end:i+n});
        i += n;
      } else if (wire === 5) {
        if (i + 4 > bytes.length) return {fields, complete:false};
        fields.push({fieldNo, wire, value:bytes.slice(i, i+4), start, end:i+4});
        i += 4;
      } else {
        return {fields, complete:false};
      }
    }
    return {fields, complete:true};
  }

  function utf8(bytes) {
    try { return tdFatal.decode(bytes); } catch { return null; }
  }

  function cleanText(s) {
    return s
      .replace(/\uFEFF/g, '')
      .replace(/[\u00A0\u202F]/g, ' ')
      .replace(/\r\n?/g, '\n')
      .normalize('NFC');
  }

  function isHumanText(s) {
    if (!s || !s.trim()) return false;
    let bad = 0;
    for (const ch of s) {
      const cp = ch.codePointAt(0);
      if ((cp < 32 && ch !== '\n' && ch !== '\r' && ch !== '\t') || (cp >= 0x7f && cp <= 0x9f)) bad++;
    }
    return bad === 0;
  }

  function firstTextField(msg, no) {
    for (const f of msg.fields) {
      if (f.fieldNo === no && f.wire === 2) {
        const s = utf8(f.value);
        if (s !== null && isHumanText(s)) return cleanText(s);
      }
    }
    return '';
  }

  function unwrapGem(bytes) {
    let cur = bytes;
    for (let depth = 0; depth < 4; depth++) {
      const p = parseMessage(cur);
      if (!p.complete) break;
      const hasCore = [1,2,3].every(n => p.fields.some(f => f.fieldNo === n && f.wire === 2));
      if (hasCore) return {bytes:cur, parsed:p};
      if (p.fields.length === 1 && p.fields[0].wire === 2) {
        cur = p.fields[0].value;
        continue;
      }
      // Known outer wrapper often stores the Gem message in field 2.
      const f2 = p.fields.find(f => f.fieldNo === 2 && f.wire === 2);
      if (f2) { cur = f2.value; continue; }
      break;
    }
    return null;
  }

  function collectHumanStrings(bytes, out, depth=0, path='root') {
    if (depth > 7) return;
    const p = parseMessage(bytes);
    if (!p.fields.length) return;
    for (let idx=0; idx<p.fields.length; idx++) {
      const f = p.fields[idx];
      if (f.wire !== 2) continue;
      const nextPath = `${path}.${f.fieldNo}[${idx}]`;
      const s = utf8(f.value);
      if (s !== null && isHumanText(s)) out.push({path:nextPath, text:cleanText(s)});
      const sub = parseMessage(f.value);
      if (sub.complete && sub.fields.length) collectHumanStrings(f.value, out, depth+1, nextPath);
    }
  }

  function extractRefs(gemMsg) {
    const found = [];
    const f10s = gemMsg.fields.filter(f => f.fieldNo === 10 && f.wire === 2);
    for (const f10 of f10s) {
      const strings = [];
      collectHumanStrings(f10.value, strings);
      let current = null;
      for (const item of strings) {
        const text = item.text.trim();
        if (/\.(txt|csv|md|pdf|json|docx?|xlsx?|pptx?)$/i.test(text)) {
          current = {name:text, url:'', mime:''};
          found.push(current);
        } else if (/^https?:\/\//i.test(text)) {
          if (!current) { current = {name:t('referenceLink'), url:'', mime:''}; found.push(current); }
          current.url = text;
        } else if (/^[\w.+-]+\/[\w.+-]+$/i.test(text)) {
          if (current) current.mime = text;
        }
      }
    }
    // De-duplicate.
    const seen = new Set();
    return found.filter(x => {
      const k = `${x.name}\n${x.url}\n${x.mime}`;
      if (seen.has(k)) return false;
      seen.add(k); return true;
    });
  }

  function buildGemText(bytes) {
    const gem = unwrapGem(bytes);
    if (!gem) return null;
    const title = firstTextField(gem.parsed, 1);
    const description = firstTextField(gem.parsed, 2);
    const instructions = firstTextField(gem.parsed, 3);
    if (!title && !description && !instructions) return null;

    const parts = [];
    if (title) parts.push(`# ${title}`);
    if (description) parts.push(`## ${t('descriptionHeading')}\n${description}`);
    if (instructions) parts.push(`## ${t('instructionsHeading')}\n${instructions}`);

    if (refs.checked) {
      const r = extractRefs(gem.parsed);
      if (r.length) {
        const lines = [`## ${t('refsHeading')}`];
        for (const x of r) {
          lines.push(`- ${x.name}${x.mime ? ` (${x.mime})` : ''}`);
          if (x.url) lines.push(`  ${x.url}`);
        }
        parts.push(lines.join('\n'));
      }
    }
    return {text:parts.join('\n\n').trim() + '\n', mode:t('modeGem')};
  }

  function buildFallbackText(bytes) {
    const strings = [];
    collectHumanStrings(bytes, strings);
    const seen = new Set();
    const clean = [];
    for (const x of strings) {
      const t = x.text.trim();
      if (t.length < 2 || seen.has(t)) continue;
      seen.add(t); clean.push(t);
    }
    if (!clean.length) throw new Error(t('noUtf8'));
    return {text:clean.join('\n\n') + '\n', mode:t('modeFallback')};
  }

  function safeBaseName(name) {
    const stripped = name.replace(/\.(?:bin|gem|pb|proto|dat)$/i, '');
    return (stripped || 'gem') + '.txt';
  }

  function saveText(text, name) {
    const prefix = bom.checked ? '\uFEFF' : '';
    const blob = new Blob([prefix + text], {type:'text/plain;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = safeBaseName(name);
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }

  async function processFile(file) {
    const card = document.createElement('article');
    card.className = 'card';
    const top = document.createElement('div'); top.className = 'row';
    const left = document.createElement('div');
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = file.name;
    const st = document.createElement('div'); st.className = 'status'; st.textContent = t('parsing');
    left.append(nm, st);
    top.append(left); card.append(top); results.prepend(card);

    try {
      const bytes = new Uint8Array(await file.arrayBuffer());
      let extracted = buildGemText(bytes);
      if (!extracted) extracted = buildFallbackText(bytes);
      st.textContent = `${extracted.mode} / ${bytes.length.toLocaleString()} bytes`;

      const buttons = document.createElement('div');
      const save = document.createElement('button'); save.textContent = t('save');
      save.addEventListener('click', () => saveText(area.value, file.name));
      const copy = document.createElement('button'); copy.textContent = t('copy'); copy.style.marginLeft = '8px';
      copy.addEventListener('click', async () => {
        await navigator.clipboard.writeText(area.value); copy.textContent = t('copied'); setTimeout(()=>copy.textContent=t('copy'), 1200);
      });
      buttons.append(save, copy); top.append(buttons);

      const area = document.createElement('textarea');
      area.value = extracted.text;
      card.append(area);
    } catch (e) {
      st.textContent = `${t('failed')}: ${e.message || e}`; st.classList.add('error');
    }
  }

  function handle(files) { [...files].forEach(processFile); }
  picker.addEventListener('change', e => handle(e.target.files));
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
  drop.addEventListener('drop', e => handle(e.dataTransfer.files));
})();
</script>
</body>
</html>
